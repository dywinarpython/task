spring:
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
  liquibase:
    change-log: classpath:db/changelog-master.xml
    enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/task
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/task
  level:
      io.r2dbc.postgresql.QUERY: DEBUG
      io.r2dbc.postgresql.PARAM: DEBUG
client:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8000}
  keycloak-uri: ${KEYCLOAK_URI:http://localhost:8080/realms/task}