spring:
  application:
    name: task-service
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  liquibase:
    change-log: classpath:db/changelog-master.xml
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskDb}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    enabled: true
  r2dbc :
    url: ${SPRING_DATASOURCE_URL_REACTIVE:r2dbc:postgresql://localhost:5432/taskDb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 30m
      max-life-time: 2h
      validation-query: SELECT 1
      validation-depth: remote
      leak-detection-threshold: 3000
    properties:
      connectTimeout: 5s
      socketTimeout: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URI:http://localhost:8080/realms/task}
  kafka:
    producer:
      bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
      properties:
        enable.idempotence: true
        request.timeout.ms: 15000
        delivery.timeout.ms: 20000

server:
  port: ${SERVER_PORT:8000}
springdoc:
  display-request-duration: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
kafka:
  partitions: ${KAFKA_PARTITIONS:2}
pageable:
  size: ${PAGE_SIZE:10}

logging:
  level:
    org.springframework: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.web.client: DEBUG
    com.mongodb: DEBUG